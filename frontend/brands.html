<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steppy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <a href="home.html" class="logo">
        <img src="images/logo.png" alt="Steppy Logo">
    </a>

    <nav class="nav">
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="types.html">Types</a></li>
            <li><a href="brands.html">Brands</a></li>
            <li><a href="trending.html">Trending</a></li>
            <li><a href="reviews.html">Reviews</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>


<!-- Search Bar -->
<div class="search-container">

    <input type="text" id="searchBrand" placeholder="Search shoe brands...">

</div>


<section class="brand-manager" aria-labelledby="brand-manager-title">

    <h1 id="brand-manager-title">Manage Brands</h1>

    <form id="brandForm">
        <input type="hidden" id="brandId">
        <input type="text" id="brandName" placeholder="Brand name" required>
        <input type="text" id="brandDescription" placeholder="Short description" required>
        <select id="brandImage" required>
            <option value="">Select an image</option>
            <option value="images/adidas.png">Adidas</option>
            <option value="images/bata.png">Bata</option>
            <option value="images/campus.png">Campus</option>
            <option value="images/nike.jpg">Nike</option>
            <option value="images/puma.png">Puma</option>
            <option value="images/skechers.png">Skechers</option>
            <option value="images/newbalance.jpg">New Balance</option>
            <option value="images/nike-air.jpg">Nike Air</option>
            <option value="images/puma-runner.jpg">Puma Runner</option>
            <option value="images/skechers-go.jpg">Skechers Go</option>
            <option value="images/logo.png">Default Logo</option>
        </select>
        <button type="submit" id="brandSubmit">Add Brand</button>
        <button type="button" id="cancelEdit" hidden>Cancel Edit</button>
    </form>

</section>



<section class="brands">
</section>



<div class="swiping">

    <a href="types.html">
        <button class="swipe-back">Back</button>
    </a>

    <a href="trending.html">
        <button class="swipe">Swipe</button>
    </a>

</div>



<script src="brandSearch.js"></script>

</body>
</html>
